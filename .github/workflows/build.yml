name: UI source checks

on:
  push:
    branches: ['codex/droiddeck-ui']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check UI sources, resources and backend isolation
        run: node tests/host/check-droiddeck-ui.js
      - name: Check whitespace
        run: git diff --check
