name: UI source checks

on:
  push:
    branches: ['codex/droiddeck-ui']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check native UI routes and retained controls
        run: python3 tests/host/check-native-deck.py
      - name: Check Simplified Chinese strings without compilation
        run: python3 tests/host/check-localization.py --static-only
      - name: Check whitespace
        run: git diff --check
